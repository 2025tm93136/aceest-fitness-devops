name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile (syntax check)
        run: python -m py_compile app.py tests/*.py
      - name: Lint with flake8
        run: flake8 .

  docker-build-and-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .
      - name: Run Pytest inside container
        run: docker run --rm aceest-fitness:test
      - name: Build runtime image
        run: docker build --target runtime -t aceest-fitness:${{ github.sha }} .
      - name: Smoke test runtime container
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:${{ github.sha }}
          for i in $(seq 1 15); do curl -fs http://localhost:5000/health && exit 0; sleep 2; done
          docker logs aceest; exit 1
